<div class="zerofy-container">
    <h2>Zerofy Business - Carbon Compliance 2026</h2>
    
    <label for="sector">Industrial Sector</label>
    <select id="sector">
        <option value="textile">Textiles (Target: 6.6% Reduction)</option>
        <option value="cement">Cement Secondary (Target: 6.6% Reduction)</option>
        <option value="iron">Iron & Steel Rerolling</option>
        <option value="general">General Manufacturing</option>
    </select>

    <div class="input-group">
        <label>Monthly Grid Electricity (kWh/Units)</label>
        <input type="number" id="electricity" placeholder="Enter units from bill">
    </div>

    <div class="input-group">
        <label>Fuel Consumption (in Metric Tonnes)</label>
        <select id="fuelType">
            <option value="coal">Coal (Indian Grade)</option>
            <option value="petcoke">Pet Coke</option>
            <option value="furnaceOil">Furnace Oil</option>
            <option value="diesel">Diesel (Gensets)</option>
        </select>
        <input type="number" id="fuelQty" placeholder="Amount in Tonnes">
    </div>

    <button onclick="calculateB2B()">Generate Compliance Report</button>

    <div id="resultBoard" style="display:none;">
        <h3>Your 2026 Carbon Snapshot</h3>
        <p>Total Emissions: <span id="totalEmissions">0</span> tCO2e</p>
        <p>Estimated CCCs Earnable: <span id="credits">0</span> Units</p>
        <div id="cbamAlert" style="color: red; font-weight: bold;"></div>
    </div>
</div>
